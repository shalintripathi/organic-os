<svg width="640" height="330" viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal: the organic-os enable-time configuration form">
  <rect x="0" y="0" width="640" height="330" rx="10" fill="#1e1e2e"/>
  <rect x="0" y="0" width="640" height="32" rx="10" fill="#181825"/>
  <rect x="0" y="22" width="640" height="10" fill="#181825"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>
  <text x="320" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#6c7086">claude</text>
  <text x="20" y="62" font-family="monospace" font-size="15" fill="#89b4fa">&gt; /plugin install organic-os@organic-os</text>
  <text x="20" y="90" font-family="monospace" font-size="15" fill="#a6e3a1">Installed organic-os v0.5.4</text>
  <text x="20" y="118" font-family="monospace" font-size="15" fill="#cdd6f4">Configure organic-os (every field optional):</text>
  <text x="36" y="146" font-family="monospace" font-size="15" fill="#6c7086">Site URL</text>
  <text x="300" y="146" font-family="monospace" font-size="15" fill="#cdd6f4">https://example.com</text>
  <text x="36" y="172" font-family="monospace" font-size="15" fill="#6c7086">Brand name</text>
  <text x="300" y="172" font-family="monospace" font-size="15" fill="#cdd6f4">Example Co</text>
  <text x="36" y="198" font-family="monospace" font-size="15" fill="#6c7086">Approval channel</text>
  <text x="300" y="198" font-family="monospace" font-size="15" fill="#cdd6f4">in-session</text>
  <text x="36" y="224" font-family="monospace" font-size="15" fill="#6c7086">Telegram bot token</text>
  <text x="300" y="224" font-family="monospace" font-size="15" fill="#cdd6f4">******** (keychain)</text>
  <text x="36" y="250" font-family="monospace" font-size="15" fill="#6c7086">WP Application Password</text>
  <text x="300" y="250" font-family="monospace" font-size="15" fill="#cdd6f4">******** (keychain)</text>
  <text x="36" y="276" font-family="monospace" font-size="15" fill="#6c7086">WordPress username</text>
  <text x="300" y="276" font-family="monospace" font-size="15" fill="#cdd6f4">seo-editor</text>
  <text x="20" y="308" font-family="monospace" font-size="15" fill="#6c7086">Skip anything - setup asks only for what is missing.</text>
</svg>
