name: ci
on:
  push:
    branches: [main, 'build/**']
  pull_request:
# CI only checks out code and runs tests; the token needs nothing but read.
permissions:
  contents: read
jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml pytest
      - run: ./scripts/audit.sh
      - run: if [ -d tests ]; then python -m pytest -q; else echo "no tests yet"; fi
      - run: ./scripts/verify-gates.sh
